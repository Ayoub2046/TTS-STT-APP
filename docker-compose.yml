# Optional containerization. The app depends on cloud Supabase, so only the
# backend + frontend are containerized. Build & run:
#   docker compose up --build
services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
