services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: maaymaxaa-backend
    restart: always
    environment:
      - PORT=4000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-placeholder_key}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder_key}
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-me}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_DATASET_REPO=${HF_DATASET_REPO:-SomaliDatasets/maay-maxaa-translation}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-1000}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: maaymaxaa-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

networks:
  default:
    name: maaymaxaa-network
